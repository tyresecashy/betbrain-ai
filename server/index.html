<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BetKing AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #05060a;
      color: white;
      font-family: ui-sans-serif;
    }

    .glow {
      box-shadow: 0 0 20px rgba(0,255,180,0.15);
    }

    .pulse {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>

<body class="flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold mb-2 text-green-400">BetKing AI</h1>
  <p class="text-gray-400 mb-6">Intelligence Engine • SAFE / BOOST / KING</p>

  <!-- Control Panel -->
  <div class="w-full max-w-md bg-[#0b0f1a] p-4 rounded-xl glow">

    <button onclick="generateSlip()"
      class="w-full bg-green-500 hover:bg-green-600 text-black font-bold py-3 rounded-lg transition">

      GENERATE SLIP
    </button>

    <div id="status" class="text-center mt-3 text-gray-400 text-sm">
      Idle
    </div>

  </div>

  <!-- Results -->
  <div id="output" class="w-full max-w-3xl mt-6 space-y-4"></div>

<script>
async function generateSlip() {
  const status = document.getElementById("status");
  const output = document.getElementById("output");

  output.innerHTML = "";
  status.innerHTML = "Generating intelligence...";
  status.classList.add("pulse");

  try {
    const res = await fetch("/generate-slip");
    const data = await res.json();

    status.classList.remove("pulse");
    status.innerHTML = "Slip Ready ✔";

    renderSection("SAFE", data.SAFE, "#22c55e");
    renderSection("BOOST", data.BOOST, "#facc15");
    renderSection("KING", data.KING, "#ef4444");

  } catch (err) {
    status.classList.remove("pulse");
    status.innerHTML = "Error fetching slip ❌";
  }
}

function renderSection(title, items, color) {
  const output = document.getElementById("output");

  const section = document.createElement("div");
  section.className = "bg-[#0b0f1a] p-4 rounded-xl glow";

  let html = `<h2 style="color:${color}" class="text-xl font-bold mb-3">${title}</h2>`;

  if (!items || items.length === 0) {
    html += `<p class="text-gray-500">No picks</p>`;
  } else {
    items.forEach(i => {
      html += `
        <div class="border-b border-gray-800 py-2">
          <div class="font-semibold">${i.match}</div>
          <div class="text-sm text-gray-400">
            Odds: ${i.odds} • ${i.outcome} • Score: ${i.score.toFixed(2)}
          </div>
        </div>
      `;
    });
  }

  section.innerHTML = html;
  output.appendChild(section);
}
</script>

</body>
</html>
